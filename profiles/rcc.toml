# Sage as the University of Chicago RCC deployment.
#
# This file is the subject. Nothing in `sage/` names the RCC; everything that does is
# here, so serving a different set of documents is a copy of this file with different
# values in it and `SAGE_PROFILE` pointed at the copy. See `profiles/README.md`.

[assistant]
name = "Sage"
icon = "🌱"
page_title = "Sage — RCC Assistant"
# The long form, for the sentence the system prompt introduces itself with.
subject = "the University of Chicago's Research Computing Center (RCC)"
# The short one, for mid-sentence use: "Ask any question about the RCC…", "No
# matching RCC documentation was found."
topic = "RCC"
# What the search tool tells the model it is searching, and what it covers.
corpus_name = "the official RCC User Guide and website"
topics = "accounts, connecting, Slurm, storage, software, GPUs or policy"
# A real path from this corpus: the one worked example the read tool gives the model.
path_example = "docs/slurm/sbatch.md#gpu-jobs"
# The email, not a page: it is what the system prompt hands a user whose question the
# documentation cannot answer, and it goes into the answer text.
contact = "help@rcc.uchicago.edu"
contact_label = "RCC Help Desk"
# Who to tell when the deployment itself is broken — the one message addressed to
# staff rather than to a reader.
operator = "RCC staff"

[copy]
welcome_title = "What can I help you with?"
welcome_subtitle = "Answers from the official UChicago RCC documentation, with citations."
placeholder = "Ask any question about the RCC…"
followup_placeholder = "Ask a follow-up question…"
login_heading = "Sage — RCC documentation assistant"
login_prompt = "Sign in with your University account to continue."
login_denied = "That account is outside the domains this deployment allows. Sign in with your University account."

[prompt]
file = "rcc.prompt.md"

# --- starter cards ---------------------------------------------------------
#
# The label is kept short so every card is a single line; the question stays
# conversational, because it is what the model is actually asked.

[[examples]]
icon = "🚀"
label = "Connect to Midway via SSH"
question = "How do I connect to Midway via SSH?"

[[examples]]
icon = "💾"
label = "Storage quotas"
question = "What are the storage quotas on Midway?"

[[examples]]
icon = "⚙️"
label = "Submit a batch job"
question = "How do I submit a batch job with sbatch?"

[[examples]]
icon = "🐍"
label = "Set up a Python environment"
question = "How do I set up a Python environment?"

[[examples]]
icon = "🎮"
label = "Run PyTorch on GPUs"
question = "How do I run PyTorch on GPUs?"

[[examples]]
icon = "📊"
label = "Check my allocation"
question = "How do I check my allocation balance?"

# --- the corpus ------------------------------------------------------------

[[sources]]
name = "docs"
path = "./docs"
path_env = "RCC_DOCS_PATH"
extensions = [".md"]
reader = "markdown"
# mkdocs with `use_directory_urls`: `slurm/sbatch.md` publishes at `slurm/sbatch/`,
# and an `index.md` is the directory it sits in at every depth.
links = "mkdocs"
# The canonical host, which is what `docs/CNAME` in this repository publishes. The
# github.io address that used to be here still works, but only as a 301 to this one:
# every citation cost a redirect, showed the reader a github.io hostname on hover for
# a University service, and would break the day GitHub Pages stopped forwarding.
base_url = "https://docs.rcc.uchicago.edu/"
base_url_env = "RCC_DOCS_BASE_URL"
# The user guide is canonical and maintained; the scraped site is marketing copy. A
# mild prior keeps the guide on top when both match equally well.
weight = 1.15
exclude_files_env = "SAGE_EXCLUDE_FILES"

[[sources]]
name = "web"
path = "./web"
path_env = "RCC_WEB_PATH"
extensions = [".txt"]
reader = "scraped"
# Each scraped file records its own source URL on line 1, which is what makes
# per-page citations possible across five different hosts.
links = "embedded"
base_url = "https://rcc.uchicago.edu/"
weight = 1.0
# Bare citation dumps: thousands of paper titles that answer no how-to question but
# match a lot of keywords. Matched against the path suffix.
exclude_files = [
    "grants-publications_list-of-publications.txt",
    "grants-publications_publications.txt",
    "publications.txt",
]
exclude_files_env = "SAGE_EXCLUDE_FILES"
# Scraped hosts that are not RCC computing documentation. `learn-radiology` is
# radiology teaching material (PI-RADS, mpMRI) and `vislab` is project showcase
# content; neither can answer an HPC how-to, and both add false-positive matches.
# Clear with `SAGE_EXCLUDE_HOSTS=` to index everything again.
exclude_hosts = [
    "learn-radiology.rcc.uchicago.edu",
    "vislab.rcc.uchicago.edu",
]
exclude_hosts_env = "SAGE_EXCLUDE_HOSTS"

# --- retrieval -------------------------------------------------------------

[retrieval]
engine = "bm25"

# Terms the stemmer must leave alone: stemming these would help nothing and hurt
# matching.
protected = [
    "gres", "globus", "https", "lammps", "gromacs", "dss", "hpss", "tmux",
    "linux", "emacs",
]

# Bidirectional groups, and the one piece of genuine domain knowledge in retrieval:
# users describe symptoms ("my job got killed") while the documentation describes
# mechanisms ("OOM", "time limit"). Members are expanded at query time only, at a
# reduced weight, so an exact match always outranks a synonym match.
#
# No "cancelled" in the OOM group. It was added for "my job was cancelled by the
# scheduler", which is an OOM or a timeout — but now that verb inflections collapse,
# it keys on `cancel`, and *the user cancelling their own job* is the opposite
# question. It made "cancel a running job" retrieve the exceeded-memory FAQ ahead of
# the page about scancel. The words that carry the meaning are the other four.
synonyms = [
    ["ssh", "login", "connect", "logon"],
    ["thinlinc", "vdi", "desktop", "gui"],
    ["sbatch", "batch", "submit", "script"],
    ["sinteractive", "srun", "interactive", "salloc"],
    ["squeue", "sacct", "status", "queue"],
    ["partition", "queue", "qos"],
    ["scavenge", "preemptible", "preempt"],
    ["oom", "memory", "killed", "timeout"],
    ["quota", "limit", "usage", "space"],
    ["allocation", "su", "balance", "accounts"],
    ["module", "software", "lmod", "package"],
    ["conda", "venv", "environment", "virtualenv", "mamba"],
    ["globus", "transfer", "scp", "rsync", "upload", "download"],
    ["gpu", "cuda", "a100", "v100", "nvidia"],
    ["scratch", "temporary", "purge"],
    ["project", "shared", "group"],
    ["cnetid", "account", "username"],
    ["midway", "cluster", "hpc"],
    ["snapshot", "backup", "restore", "recover"],
    # `MidwayGeoSpatial` is the User Guide's own title for the GIS tutorial, and it was
    # the one page in the corpus that retrieved *nothing at all* for its own title: a
    # CamelCase compound is a single token, the page's prose never writes it that way,
    # and a term that appears in no document body scores zero even where it does appear
    # in the title and the path — the scorer skips a term with no IDF before it reaches
    # either boost. So the word has to be connected to words the pages do use.
    #
    # A group rather than splitting CamelCase in the tokenizer, which was the other
    # candidate and is a worse trade: `MidwayGeoSpatial` would split to `midway` +
    # `spatial`, which is "midway" (a term in 200-odd sections) plus the word that
    # titles `r.md`'s "Spatial Packages" — one page rescued by making every score in
    # the index noisier. `gis` and `geospatial` are what this page and its siblings
    # actually say, and they are synonyms of each other whatever happens to this title.
    ["midwaygeospatial", "geospatial", "gis"],
]

# --- where models come from ------------------------------------------------
#
# Order is preference order: it decides which provider a fresh session starts on when
# `SAGE_DEFAULT_MODEL` names nothing available, and which one an automatic failover
# reaches for. A provider with no key set is skipped entirely.

[[providers]]
name = "openrouter"
kind = "openai"
key_env = "OPENROUTER_API_KEY"
hint = "OpenRouter keys start with `sk-or-v1-`; the free router needs no balance."
# One model, and it is a router rather than a model — which is the whole point of
# choosing it. `openrouter/free` ("Free Models Router") picks a free model per request
# from whatever OpenRouter is serving, filtered to the ones that support the parameters
# the request actually carries, so a tool-calling turn is never routed to a model that
# cannot call a tool.
#
# That is the same job `.github/workflows/lineup.yml` does for Zen — find the free
# models, notice which have stopped answering, keep the profile's list true — done on
# the provider's side, for free, per request, with no ledger and no daily pull request.
# The reason to hand it over is that the Zen half is genuinely hard to keep right: a
# free tier rotates its lineup without notice, `hy3-free` left the catalogue and came
# back two days later, and the workflow exists because four dead models once sat in this
# file for three days.
#
# Measured before trusting it (2026-08-28, six requests, the app's own question and tool
# schema): six tool calls out of six, routed across `liquid/lfm-2.5-2.6b:free`,
# `cohere/north-mini-code:free`, `inclusionai/ling-3.0-flash-fin:free`,
# `minimax/minimax-m2.7:free` and `dots-studio/dots-3-note-preview:free`, median 1.4s.
# One of those — `liquid/lfm-2.5-2.6b:free` — answered `429 … temporarily rate-limited
# upstream` when asked directly in the same minute, so the router is absorbing the
# upstream failures rather than passing them on. That is the behaviour being bought.
#
# What it costs, and it is a real trade: the model changes from turn to turn, so answer
# quality and speed vary in a way a pinned model's do not, and a reader cannot tell
# which model wrote the answer they are looking at. Availability over consistency,
# deliberately — a 2.6B model that answers beats a 550B one that returns an empty
# stream, which is what Zen's Nemotron models were doing when this was added.
base_url = "https://openrouter.ai/api/v1"
base_url_env = "OPENROUTER_BASE_URL"
# Discovery still runs — it is how the app learns the router is being served at all —
# and `free_marks` below narrows all 387 models to this one.
# TEMPORARY, and the first entry is the one a fresh session starts on — see
# `openai_compat._order`, which puts this list ahead of everything discovered.
#
# `~deepseek/deepseek-v4-flash-latest` is PAID, which is why it needed a line of its own in
# `free_marks` below. It is here because on 2026-09-12 the free lineup stopped being
# able to answer at all, for two unrelated reasons on the same afternoon: OpenRouter's
# free pool hit its account-wide cap of 1000 requests/day (`X-RateLimit-Remaining: 0`,
# resetting at 00:00 UTC), and OpenCode Zen closed its free tier to third-party clients
# (`HTTP 400 MissingSessionID`, "OpenCode's free tier can only be used in OpenCode").
# Mistral answered `429` as well. Every provider refusing at once is not a state the
# failover machinery can rescue.
#
# What it costs: $0.03 per million input tokens and $0.07 per million output, the
# cheapest thing OpenRouter serves that is not free — a question of this app's shape
# costs a small fraction of a cent. It takes tools, which this app requires, and its
# context is 1.31M tokens.
#
# What it costs the READER: it is TEXT-ONLY (`input_modalities: ["text"]`), so an
# attached screenshot will not be looked at and `composer.render_attachments` says so
# in as many words. `openrouter/free` takes images and is still second in this list, so
# a failover onto it restores that; `deepseek/deepseek-v4-flash-vision-exp` is the
# variant that sees, at roughly 3x the price, if pictures matter more than pennies.
#
# TO REMOVE: delete it from this list and from `free_marks`, and put
# `openrouter:openrouter/free` back as `config.DEFAULT_MODEL`'s fallback. Nothing else
# knows about it.
models = ["openrouter/free", "~deepseek/deepseek-v4-flash-latest"]
models_env = "SAGE_OPENROUTER_MODELS"
# The mark is the router's own id, so the rule reads "offer exactly this". Unusual, and
# deliberate: OpenRouter fronts 387 models of which 18 are free and this key holds
# $1.80, so a wider rule is a picker full of buttons that return 402. Widening it to
# `:free` would offer all 18 — every zero-priced model there carries that suffix, and
# every model carrying it is zero-priced — and that is the lineup this entry chose not
# to have, because nine of the eighteen were rate-limited or dead on the same sweep the
# router sailed through.
# The second mark is a literal id and it is NOT free — the same shape as `big-pickle`
# in the Zen entry below, and for a different reason: that one is free and unmarked,
# this one is paid and deliberate. `free_only` filters what is offered down to whatever
# matches this list, so without the literal a paid id could not be offered, selected or
# failed over to. See the note on `models` above for why it is here and how to remove
# it. The name of this field is wrong for it, which is the honest price of not
# inventing a second mechanism for a temporary state.
free_marks = ["openrouter/free", "~deepseek/deepseek-v4-flash-latest"]
free_marks_env = "SAGE_OPENROUTER_FREE_MARKS"
# This provider takes OpenRouter's `reasoning` request parameter, which is what the
# Think toggle in the corner of the input box sends. Declared here rather than assumed
# from `kind`, because `kind = "openai"` also covers OpenCode Zen, which has never
# heard of the field — and it is what decides whether the toggle is drawn at all.
#
# Checked against `GET /models` rather than taken on trust: `supported_parameters` for
# `openrouter/free` lists `reasoning`, and so does every one of the 19 `:free` models
# it routes to. `reasoning_effort` — the low/medium/high dial — is on only 6 of those
# 19, which is why the control is a switch: the router serves a different model every
# turn, so an effort setting would be honoured on about a third of them with nothing
# on screen able to say which.
reasoning = true
# `openrouter/free` is a ROUTER, not a model, and this is where the app is told so.
#
# It matters because it changes what "try again" means. Everywhere else in the lineup a
# repeat is pointless — the model that just returned nothing will return nothing again —
# so `View.alternative` skips anything already `tried` and walks on to the next name.
# Here the same id resolves to a different model on the next request: measured over 33
# rolls on 2026-09-11 it served 14 distinct models, and two consecutive rolls repeated a
# model twice in 32, so a re-ask lands somewhere else about 94% of the time. Asking again
# is the cheapest recovery available and the walk could not reach it.
#
# What makes it worth having a recovery for: one of the names in the free pool is
# `nvidia/nemotron-3.5-content-safety:free`, a safety CLASSIFIER whose entire output is
# `User Safety: safe`. It was reached on 2 of 33 tool-less rolls.
# `normalize.is_moderation_verdict` is what stops that being shipped as an answer; this
# is what gets the reader a real one instead of an error card. Neither OpenRouter's
# `plugins.excluded_models` nor `provider.ignore` can keep the router off it — both were
# tried — so recovery after the fact is the only lever there is.
routers = ["openrouter/free"]
routers_env = "SAGE_OPENROUTER_ROUTERS"
# What the picker calls it, because the served id is not a name — it is the billing
# arrangement, and a reader choosing a row is not choosing a billing arrangement. The id
# is untouched everywhere it counts: it is what goes upstream, what the feedback log and
# `tools/agent_bench.py` record, and what the error card's technical-details panel
# prints, so nothing that measures a model is measuring the nickname.
#
# "enigma" rather than a model name, because there is no one model to name: the row is a
# different model every turn and any specific name would be wrong most of the time.
# The paid stand-in gets a name too, and unlike the router's it may say which
# model it is: the row is one pinned model every turn, so naming it is the
# honest thing rather than the misleading one. The `~` and the vendor path are
# what a reader does not need.
labels = { "openrouter/free" = "enigma", "~deepseek/deepseek-v4-flash-latest" = "deepseek v4 flash" }
free_only = true
free_only_env = "SAGE_OPENROUTER_FREE_ONLY"

[[providers]]
name = "vertex"
kind = "vertex"
# `SAGE_VERTEX` is a SWITCH, not a secret: set it to anything and this provider is in
# the lineup. Vertex needs no credential — the instance mints its own token from the
# metadata server — but `ui.access.configured_providers` decides a provider is usable
# by whether `key_env` names a variable that is set, so a provider declaring no
# key_env at all is silently never offered. Found by test, not in production.
#
# A switch rather than changing that rule, because "needs no key" and "needs a key
# nobody set" look identical from there, and conflating them would delete the clear
# "set an API key" gate a fresh clone depends on.
key_env = "SAGE_VERTEX"
hint = "Vertex needs no API key: set SAGE_VERTEX=1 and grant the runtime service account roles/aiplatform.user."
# No base_url either: it carries the project id, which is deployment and not subject,
# so sage/providers/vertex.py reads it from the instance. Set base_url only to point a
# local run at a specific project.
#
# FIRST, because it is the only route that spends Google Cloud credit. The Gemini
# Developer API below bills an AI Studio prepayment balance that Cloud Billing credit
# does not reach — measured as `Your prepayment credits are depleted` from a key minted
# in a project with billing on and $300 unspent.
#
# Measured on the `global` endpoint, which is not optional: `us-central1` answers for
# gemini-2.5-flash and returns `Publisher model ... not found` for 3.5, 3.6 and 3.8.
#   google/gemini-3.8-flash   OK
#   google/gemini-3.6-flash   OK
#   google/gemini-3.5-flash   OK   <- shed as "high demand" 0/4 on the free tier
#
# WHAT TO KNOW BEFORE LEAVING THIS FIRST. Vertex has no free tier; every token bills,
# and on a pay-as-you-go account a spent credit produces NO error — it produces an
# invoice. So nothing here fails over on its own when the money runs out. What catches
# it is the budget alert on the project, which measures NET spend and is therefore
# silent for as long as credit covers the usage and mails the moment it does not.
# If that mail arrives and the answer is "stop paying", delete this block; the free
# `google` entry below is already the next in line.
models = [
    "google/gemini-3.8-flash",
    "google/gemini-3.6-flash",
    "google/gemini-3.5-flash",
]
# Vertex's OpenAI surface serves no `/models`, so discovery fails and the adapter falls
# back to the list above. Documented behaviour, not a workaround.

[[providers]]
name = "google"
kind = "openai"
key_env = "GEMINI_API_KEY"
hint = "Gemini keys start with `AIza`. Make it in AI Studio on a project with NO billing account — that, and not the key, is what puts it on the free tier."
# Gemini speaks OpenAI over `/v1beta/openai`, so this is a profile entry and not an
# adapter. Measured: discovery returns 56 ids, tool calls come back well formed,
# streaming emits `data:` chunks and `[DONE]`, and the `models/`-prefixed ids the
# listing returns are accepted as model ids.
#
# WHY THE KEY COMES FROM AN UNBILLED PROJECT, which is the opposite of the tidy move.
# Gemini's tier is decided by whether an active billing account is linked to the KEY'S
# PROJECT, not by anything about the key. A key minted in the project this app deploys
# to would be Tier 1 — paid — while one from a project with no billing is free tier and
# stays free. Moving it somewhere tidier would silently start a bill.
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
base_url_env = "GEMINI_BASE_URL"
# Second in the lineup: the backup, which is the right slot for a low rate limit.
# Failover reaches it when OpenRouter's free pool is capped, which is not sustained
# traffic, so a quota too small to serve every turn is ample for the turns nothing else
# will take.
#
# THE LINEUP IS MEASURED, and the first attempt at it was wrong in a way worth
# recording: it listed `gemini-2.5-flash` because the substring scan that produced it
# never looked past `gemini-3-flash-preview`. The API serves 3.5, 3.6, 3.7 and 3.8
# flash. Picking from a partial scan is how a lineup ends up three generations stale on
# the day it is written.
#
# Four attempts each, same question and tool schema:
#   gemini-3.8-flash        4/4  ~1s    <- newest, and it works
#   gemini-3.6-flash        4/4  1.0s
#   gemini-3.5-flash-lite   ok   0.5s   <- fastest
#   gemini-3.1-flash-lite   ok   2.2s
#   gemini-3.7-flash        0/4         truncated/timed out every time
#   gemini-3.5-flash        0/4         "currently experiencing high demand"
#   gemini-3.1-pro-preview   -          "exceeded your current quota" (pro is not free)
#
# The two that fail are the free tier being shed first when capacity is tight — 3.8 did
# it once on the first try and then went 4/4. That is the honest cost of the free tier,
# and the reason a paid key is a real option rather than a waste: Tier 1 is not the
# traffic that gets turned away.
models = [
    "models/gemini-3.8-flash",
    "models/gemini-3.6-flash",
    "models/gemini-3.5-flash-lite",
]
# 56 -> 3, and no `deny` needed: each of these three marks is unique as a substring
# across everything the API serves. `gemini-2.5-flash` was not — it also caught the
# tts, image, lite and native-audio variants built on it, which is what the deny list
# that used to be here existed to undo.
free_only = true
free_marks = ["gemini-3.8-flash", "gemini-3.6-flash", "gemini-3.5-flash-lite"]
free_marks_env = "SAGE_GOOGLE_FREE_MARKS"

