# One theme per colour scheme, and both of them stated.
#
# This used to be a single `[theme]` block, with a comment claiming `base` was left
# unset so Streamlit would follow the browser. It does not work that way: setting any
# `[theme]` value at all makes the theme a *custom* one, and a custom theme's `base`
# defaults to light. So on a dark-mode device Streamlit painted a white page while
# static/app.css — which keys off `prefers-color-scheme` — went dark underneath it,
# and the reader got the dark palette on a white page: source links at #b6bcc7 on
# white (1.9:1, invisible), a near-black popover panel, and the model name under the
# input in pale grey. Measured in the running app, not reasoned about.
#
# `[theme.light]` and `[theme.dark]` are per-scheme sections, so the browser
# preference decides again and the two stylesheets agree. The dark primary is the
# tint app.css already uses for brand text on a dark page; #800000 on near-black
# reads at 1.73:1.
#
# The typeface is named HERE as well as in static/app.css, and it has to be. This
# file is the only thing that decides what Streamlit paints its OWN widgets with —
# the buttons, the popover, the composer's textarea, the sidebar — so a stylesheet
# that changed the font alone would move the prose and leave half the page on
# Streamlit's default. `font` was `"sans serif"`, which is Source Sans Pro: the face
# every Streamlit app ships with, and the single loudest reason this one read as a
# generic Streamlit app whatever colour it was painted.
[theme]
# A stack, not a name: `sans-serif` is what a reader gets for the one frame before
# the woff2 below arrives, and for any glyph Plex's latin subset does not carry.
font = "IBM Plex Sans, sans-serif"
# Code blocks and inline code chips. Streamlit keeps this separate from `font`, and
# so does app.css — see `--font-mono` there for what else is machine-shaped enough
# to earn it.
codeFont = "IBM Plex Mono, monospace"
# `headingFont` is deliberately unset: it falls back to `font`, and one face for
# headings and prose is the design. Stating it would be a second place to forget.

# The faces themselves, served from this repo rather than from a CDN — see
# `server.enableStaticServing` below for the switch that makes `app/static/` a URL.
# Google's fonts.gstatic.com would be no files to carry and a third party between the
# reader and the page: an outage, a blocked domain or an offline demo, and the app
# silently falls back to `sans-serif`. Both families are OFL-1.1; the licence travels
# with them in static/fonts/OFL.txt, which the licence requires.
#
# FIVE files, not thirty-two. The sans upright and the sans italic are variable fonts
# carrying the whole 400–700 range in one file each, which is exactly the span app.css
# asks for (400 prose, 500/600 labels, 700 headings) — `weight` takes a range, and
# Streamlit passes it through to the `font-weight` descriptor. The sans italic is here
# because Streamlit's own Source Sans has one and an answer's `*emphasis*` would
# otherwise be a synthetic slant.
#
# Each is the `latin` subset (about 145 KB for the five). No `unicodeRange`, so the
# browser falls back per glyph rather than per range: the 72 documents in docs/ have
# no latin-ext character in them at all, measured, and an emoji or a ● was already
# coming from the system font.
#
# Where they came from, since a woff2 says nothing about itself: the `latin` faces of
# fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400..700;1,400..700 and
# family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400 (Plex Sans v23, Plex Mono v20),
# downloaded from the urls that stylesheet gives and renamed to say what each one is.
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-700.woff2"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-italic-latin-400-700.woff2"
weight = "400 700"
style = "italic"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-400.woff2"
weight = "400"
style = "normal"

# Mono italic and mono bold, both for the same reason and it is not emphasis:
# Streamlit's syntax highlighter italicises comments and bolds keywords, so a code
# block asks for both. Counted in the running app on one ordinary sbatch answer —
# three italic spans (the `#SBATCH` directives) and one at weight 700 (the shebang).
# Without these two files every one of them is a synthetic slant or smear, which at
# 14px is visible. This is what "the weights actually used" means here: measured, not
# guessed at, which is also why there is no mono 500 or 600.
[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-italic-latin-400.woff2"
weight = "400"
style = "italic"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-700.woff2"
weight = "700"
style = "normal"

[theme.light]
primaryColor = "#800000"

[theme.dark]
primaryColor = "#f0a8ac"

[server]
# Deliberately ABOVE SAGE_MAX_UPLOAD_BYTES (10 MB), so the app is the one that
# refuses an oversized file rather than Streamlit.
#
# Streamlit renders its own "File must be 10.0MB or smaller" *inside* the uploader
# widget — and app.css hides that widget, because uploads are driven from the
# paperclip in the composer instead. At 10 MB the two limits were the same number, so
# an 11 MB file was turned away by Streamlit and the reason went with it: no chip, no
# warning, nothing anywhere on the page. `sage/files.py` checks the length before it
# parses anything, so what the headroom costs is one upload of at most this size
# arriving before it is turned away with a message the reader can actually read.
#
# It moves the silent cliff rather than removing it: a 25 MB file still disappears
# into the hidden widget, and `accept_multiple_files` means the memory exposure is
# this number times however many files arrive at once. Twice the app's own limit is
# the compromise — it covers the case people actually hit (a PDF a little over the
# line) without holding a quarter of a gigabyte per session for one refusal.
# tests/test_streamlit_config.py holds the two numbers in that order.
maxUploadSize = 20
enableXsrfProtection = true

# What turns `static/` into `app/static/` over HTTP, and the only reason the
# `[[theme.fontFaces]]` urls above resolve to anything. Without it the faces 404 —
# on Community Cloud as well as here — and every one of them falls back to
# `sans-serif` without failing anything: the page renders, in the wrong face.
# `tests/test_streamlit_config.py` holds the switch against those urls for exactly
# that reason.
#
# It also publishes static/app.css and static/app.js at those paths. Both are already
# inlined verbatim into the page `sage/ui/assets.py` serves, so nothing becomes
# readable that was not; `.streamlit/secrets.toml` is elsewhere and is not served.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# Hides the Deploy button and hamburger. It also leaves Streamlit's running/stop
# indicator in the header, which this note used to say was the point — a long generation
# could still be cancelled from it. That is no longer why: the composer's send arrow
# becomes a stop square for the length of a turn, and `static/app.css` hides the
# indicator outright, because it mounts and unmounts in the same corner as the theme
# toggle and was drawn on top of it.
toolbarMode = "minimal"
showErrorDetails = false
