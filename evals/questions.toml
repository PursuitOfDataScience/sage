# mechanism here, which is the opposite of what the synonym groups are meant to do.
#
# Re-measured 2026-09-12, after the title field was length-normalised: `sbatch.md` has
# climbed to RANK 5, so `tools/gate_check.py` now reports this as "NOW PASSES" and its
# note says a gap that passes is one to promote. Not promoted, and the rank is the
# reason — passing recall@5 from fifth place is one scoring change away from failing
# again, and a ratchet set on that would break on the next honest improvement. The
# diagnosis above is still exactly right: `slurm/faq.md` leads at 36.6 against 25.2 for
# the page that documents the flag. Promote it when `sbatch.md` reaches the top three.
