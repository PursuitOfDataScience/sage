# Answerable questions, with the page(s) a correct answer rests on.
#
# `pages` — any one of them counts as a hit, because several questions have more than
#   one defensible answer page and picking a favourite would fail a good retrieval.
# `must_mention` — a token a correct ANSWER has to contain, where there is an obvious
#   one. This is the cheapest real answer-correctness signal available: "how do I
#   cancel a job" without the word `scancel` anywhere in it did not answer the
#   question, whatever else it said, and no judge is needed to see that.
# `kind` — `faq` marks a question lifted from a question-shaped heading already in the
#   corpus. Those are free gold labels and they are also LEXICALLY EASY, because the
#   question's own words are on the page it points at: they score near 100% and are a
#   ceiling check, not a discriminating benchmark. `asked` marks a question written the
#   way a reader would put it, which is the set worth watching.

