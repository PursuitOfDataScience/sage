# The pages `web/` is made of, and the only pages `tools/rcc-web-scrape.py` fetches.
#
# Nothing off this list is fetched and no link is followed. A sitemap page that is not
# here is printed in every run's summary as "available, not included": add it under
# [allow] to start fetching it, or under [deny] to stop it being reported. A URL in
# both is denied, and its file leaves `web/` on the next run; so does the file of a URL
# taken off [allow].
#
# Each URL must be written exactly as its file's `URL:` line says: the file name is
# made from it, and the `URL:` line is the citation a reader clicks.

[sitemaps]
# Where `<lastmod>` comes from. A page with no lastmod, which is every page on the four
# subdomains (they publish no sitemap), is fetched on every run. A page that was in a
# sitemap and leaves it has its file removed.
urls = ["https://rcc.uchicago.edu/sitemap.xml"]

