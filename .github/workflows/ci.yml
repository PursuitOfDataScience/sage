name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The retrieval layer is importable without Streamlit or the Mistral SDK,
      # which is what keeps this job fast. pypdf is installed so the upload tests
      # exercise real parsing rather than the ImportError fallback.
      - name: Install test dependencies
        run: pip install --disable-pip-version-check pytest ruff pypdf httpx

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check app.js parses
        run: node --check static/app.js

      # Renders static/app.css against a replica of Streamlit's DOM in the Chrome
      # already present on the runner, and fails on clipping, content hidden behind
      # the input bar, horizontal overflow, unwanted wrapping, a control something
      # else is painted on top of, the gap between a question and its answer, dead
      # space above the input bar, or low contrast — see the docstring in
      # tools/render_check.py. Every UI bug that has shipped from this repo was
      # pure CSS, and this runner's Chrome has caught one this sandbox's did not.
      #
      # A missing browser is a BROKEN check, not a passing one. This step used to
      # print `::warning::` and `exit 0` when /usr/bin/google-chrome was not there,
      # so the day the runner image moves Chrome, all 684 renders quietly stop being
      # checked and the job still goes green — with an annotation nobody reads on a
      # tick everybody does. That is the exact failure this repo is written against:
      # a check that cannot fail reads as a pass, which is worse than no check. So
      # the browser is searched for across the names runner images actually use, the
      # one found is printed so the log says what was measured, and finding none is
      # a hard failure with the remedy in it.
      - name: Check the layout renders correctly
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable \
                           /opt/google/chrome/chrome /usr/bin/chromium-browser \
                           /usr/bin/chromium \
                           "$(command -v google-chrome || true)" \
                           "$(command -v chromium || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SAGE_CHROME="$candidate"
              break
            fi
          done
          if [ -z "${SAGE_CHROME:-}" ]; then
            echo "::error title=Layout check did not run::No Chrome or Chromium on this runner, so tools/render_check.py rendered nothing. This is a required check: add a browser step (browser-actions/setup-chrome) rather than letting 684 renders pass without being rendered."
            exit 1
          fi
          echo "Layout check rendering with $SAGE_CHROME"
          SAGE_CHROME="$SAGE_CHROME" python tools/render_check.py

  deps:
    name: Dependencies resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      # Guards the class of bug this replaced: requirements.txt listed a package
      # that was never imported while omitting one that was, and the SDK import
      # path differs between mistralai 0.x and 1.x.
      - name: Verify the imports the app actually uses
        run: |
          python - <<'PY'
          import httpx
          import streamlit
          import pymupdf
          from mistralai import Mistral
          from pypdf import PdfReader
          print("streamlit", streamlit.__version__)
          print("imports OK")
          PY

      # The composition root, not its pieces: this is the one check that the profile
      # the repository ships still assembles into a working assistant — its source
      # trees found, its reader and URL scheme registered, its engine built, its
      # tools bound to that index.
      - name: Assemble the assistant from the shipped profile
        run: |
          python - <<'PY'
          import logging
          logging.basicConfig(level=logging.INFO)
          from sage import runtime
          sage = runtime.build()
          assert sage.corpus.chunks, "no chunks indexed"
          assert sage.retriever.search("storage quota"), "search returned nothing"
          assert len(sage.tool_schemas) == 2, sage.tool_schemas
          print("profile:", sage.profile.origin, "->", sage.summary())
          PY
