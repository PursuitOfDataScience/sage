# Reads what the provider serves against what this repository says it serves, daily.
#
# **Zen only** — `--provider opencode` on the run below. The profile's other
# OpenAI-compatible provider is OpenRouter, and its entry is one id, `openrouter/free`,
# a router that picks a working free model per request. Every job this workflow does
# happens on that provider's side, so scoping is not a limitation here but the point:
# see the comment on the run step for what leaving it unscoped would spend.
#
# The app does not depend on this. Model lists are discovered from `GET /models` at
# runtime and filtered by a rule, so a model Zen starts serving free under a `-free`
# name is in the picker the moment it exists, and one that disappears is dropped the
# same way — `app.current_model` falls through a missing `SAGE_DEFAULT_MODEL` to the
# first discovered option. Nobody has to merge anything for a reader to benefit.
#
# What this catches is the four things the rule cannot, all of them in
# `tools/lineup_check.py`'s docstring: a stealth codename with no marker in it, a model
# that is served but cannot answer, how long an absence has actually run, and the
# repository's own record going quietly false. The last one is the reason for the daily
# schedule rather than a manual run: a fallback list that is wrong is only discovered on
# the day discovery fails, which is the worst possible day to discover it.
#
# Two outputs, because there are two kinds of finding and only one of them is an edit:
#
#   * **A pull request**, when the profile's list and the served catalogue have parted
#     company in either direction — a free model served and not named, or a named model
#     the provider stopped serving `--retire-after` days ago. That is a diff, so it
#     arrives as one: on a fixed branch, rebuilt from `main` each time and force-pushed,
#     so the diff is always just today's drift and never a pile of superseded ones.
#     Additions go at the end and nothing is reordered — the first entry decides what
#     every fresh session starts on and what an automatic failover lands on, and a job
#     that rewrote that daily from a catalogue listing would be choosing the reader's
#     model on no evidence about whether it is any good. A removal that takes the first
#     entry does move both, and the report says so in as many words.
#
#     Removal waits seven days on purpose. `hy3-free` was absent from the catalogue and
#     answering 401, and was served again two days later with nothing about this
#     deployment changed, so a job that acted on one morning's listing would remove a
#     working model and put it back on Thursday. The ledger below is what makes the
#     difference between "gone today" and "gone since the 22nd" expressible at all.
#     Until this existed the retirement half was a line in an issue: four models sat in
#     the profile for three days, reported every morning, removed by nobody.
#     This one has a prerequisite the workflow cannot grant itself: *Allow GitHub
#     Actions to create and approve pull requests*, under Settings -> Actions ->
#     General. A `permissions:` block does not cover it, and with it off the create
#     call is refused whatever the token can do. That is not fatal here -- the branch
#     is pushed either way and the report falls through to the issue below -- but the
#     diff then has to be opened by hand.
#
#   * **One issue, updated in place**, when there is news that is not an edit — a name
#     that answered without matching `free_marks` (only a person can widen a rule), an
#     absence too recent to act on, a configured default that is no longer served, or
#     `free_marks` matching nothing at all, which is the one urgent state here because
#     it makes the picker offer the whole paid lineup. Updated rather than reopened, so
#     a month of quiet drift is one thread.
#
# Every run writes the report to the job summary whether or not it opens anything, so
# there is always somewhere to look that is not a diff.
#
# **Not a gate, deliberately.** `--fail-on-drift` exists and this does not pass it, for
# the reason EVAL.md gives about Axis B: a free tier rotating its lineup is not this
# repository's fault, a red build for it would be red most weeks, and a check that is
# red most weeks gets loosened until it is quiet. CI stays green; this reports.
#
# Cost, in the two currencies that matter:
#   * **Provider allowance: about zero, and no key.** `GET /models` on Zen needs none
#     (measured with no header and with a bogus one — 200 and the full catalogue both
#     times), so the drift half spends nothing. Only `--probe` sends a completion, and
#     only for a name the ledger has not classified before. The one-time sweep of Zen's
#     55 paid models spends no allowance either, because a keyless request for a paid
#     model is refused with `Missing API key` before it generates anything — which is
#     also what prices it. A day Zen changes nothing costs nothing at all.
#   * **Actions minutes:** free, this repository being public.
#
# The ledger lives in the Actions cache rather than in the repository, because it is bot
# state and not source: it exists so that "missing since" is a date instead of "gone
# today, every day". Losing it costs one run's worth of accrual and nothing else.
#
# Caveat inherited from keepalive.yml, and it is the one that will actually bite:
# scheduled workflows are disabled automatically after sixty days with no commit to this
# repository. Re-enable from the Actions tab.

name: lineup

on:
  # NO SCHEDULE. It ran daily at 10:20 UTC and the owner cleaned up after it three
  # times in one afternoon — a closed PR (#73), a deleted branch (`lineup/auto`) and a
  # closed issue (#66) — with the reasoning stated plainly each time: "we have
  # openrouter, and i said it's default... who cares what that auto is", and "why is
  # this shit still there? close it". A daily job whose output is three artifacts
  # nobody wants is not maintenance, it is noise with a cron on it.
  #
  # What it was FOR still matters a little, and less than it did. It maintains the
  # OpenCode Zen denylist, and Zen answers on a failover — but `MAX_MODEL_ATTEMPTS` is
  # 1 now, so a turn asks the model it was given and stops. A dead Zen model is no
  # longer something a reader can be walked into by a turn that started on the router;
  # it can only be reached by a deployment that sets Zen as its default or turns the
  # walk back on. Either of those wants this job, and can have it: the manual trigger
  # below is untouched, so `gh workflow run lineup.yml` does the whole probe and opens
  # the same PR.
  workflow_dispatch:
    inputs:
      probe:
        description: 'Send a real completion per new or unclassified model'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: lineup
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # httpx and nothing else. The checker imports `sage.profile`, `sage.config` and
      # `sage.providers`, none of which need Streamlit or the Mistral SDK — the same
      # property that keeps the CI test job fast.
      - name: Install the one dependency
        run: python -m pip install --quiet --disable-pip-version-check httpx

      # Rolling key: each run saves under its own id and restores the newest earlier
      # one. This is the documented idiom for state that accumulates rather than being
      # derived from a lockfile.
      - name: Restore the ledger
        uses: actions/cache@v4
        with:
          path: report/lineup.json
          key: lineup-ledger-${{ github.run_id }}
          restore-keys: |
            lineup-ledger-

      - name: Read the lineup
        id: check
        env:
          # Deliberately not required, and deliberately still read. Zen serves its free
          # models to a request with no `Authorization` header at all — 200 and a full
          # streamed completion — so every check here works with no secret, and a
          # keyless refusal is the *better* evidence of tier: "Missing API key" can only
          # mean the model requires one. A key adds one thing, the ability to probe a
          # paid model as something other than paid, which a free-tier deployment does
          # not need. This line stays so a deployment that has a balance can use it.
          #
          # It used to be load-bearing by accident: the checker skipped the probing pass
          # without a key, this repository has no such secret, and so the two findings
          # that need a completion — a stealth codename, and a model that is served but
          # answers nothing — were never once checked. Adding the secret was never the
          # fix; sending no header was.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          probe=--probe
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.probe }}" = "false" ]; then
            probe=
          fi
          # Zen only, and that is a statement about the other provider rather than a
          # narrowing of this one. OpenRouter is in the profile as a single entry,
          # `openrouter/free`, which is a router that picks a working free model per
          # request — so the three jobs this workflow does for Zen have no work to do
          # there. There is no list to keep true (one id, and it is the rule as well),
          # no retirement clock (a free model going dark is the router's problem, and
          # measurably its behaviour: it routed around a 429 in the same minute Zen's
          # equivalent model returned one), and no stealth codename to hunt, because
          # OpenRouter publishes exact per-model pricing and every zero-priced model it
          # serves says so in its id.
          #
          # Left in and this would be active harm, not just waste: the rule matches one
          # of the 387 models OpenRouter fronts, so the other 386 land in
          # `unclassified` — the stealth-codename queue — and every run would spend its
          # whole probe budget asking paid models whether they are secretly free, then
          # report the answer. Twelve requests a day and a section of noise, for a
          # question that provider's catalogue already answers.
          python tools/lineup_check.py $probe --provider opencode --update \
            --retire-after 7 --summary-out drift.md
          {
            echo "## Model lineup"
            echo
            cat drift.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Split from the script's own notion of "material change": a profile edit is a
      # diff to review, everything else is a thing to read. `git diff` on the profile
      # is the honest test for the first, because it is the actual artifact.
      - name: Sort what happened into a diff and a message
        id: sort
        run: |
          if ! git diff --quiet -- profiles/; then
            echo "edited=true" >> "$GITHUB_OUTPUT"
          else
            echo "edited=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the pull request
        id: pr
        if: steps.sort.outputs.edited == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The lease is stated outright, and it has to be. Bare `--force-with-lease`
          # reads the expected value from the remote-tracking ref *its fetch refspec
          # maps to*, and `checkout@v4` configures one branch:
          # `+refs/heads/main:refs/remotes/origin/main`. `lineup/auto` is not in it, so
          # the expectation resolves to "should not exist" and every run after the
          # first is rejected `stale info` -- which is why the run that created this
          # branch passed and the next one would not have. Fetching the ref by hand
          # does not help; the refspec is what the lease consults. An explicit value
          # needs no tracking ref at all, and an empty one is the honest expectation on
          # the first run: the branch is absent, and it must still be absent when we
          # push. Verified both ways, including that a stale value is still refused.
          expected=$(git ls-remote origin refs/heads/lineup/auto | cut -f1)
          git switch -C lineup/auto
          git add profiles/
          # Built as a file and passed with -F. `drift.md` is markdown full of
          # backticked model ids, and inside a double-quoted -m argument bash would
          # read `muse-spark-1.2-contributor-free` as a command to run.
          {
            echo 'profile: follow the free models the provider is serving'
            echo
            echo 'Opened by .github/workflows/lineup.yml. Additions go at the end of'
            echo 'the list and nothing is reordered, because the first entry is what a'
            echo 'fresh session starts on and what an automatic failover lands on, and'
            echo 'that is a judgement this workflow does not make. Removals are models'
            echo 'the provider has not served for seven days or more; an absence'
            echo 'shorter than that is reported and left alone, because hy3-free came'
            echo 'back after two. The report below says which is which.'
            echo
            cat drift.md
          } > commit.txt
          git commit -F commit.txt
          git push --force-with-lease="lineup/auto:$expected" origin lineup/auto
          if [ -z "$(gh pr list --head lineup/auto --state open --json number -q '.[].number')" ]; then
            # Not fatal. "Allow GitHub Actions to create and approve pull requests" is a
            # repository setting, and `permissions: pull-requests: write` above cannot
            # grant it -- with it off, this call is refused however the token is scoped.
            # The branch is already pushed by now, so the diff exists and only its
            # announcement is missing: say so, hand the report to the issue step below,
            # and leave the run green. Failing here would make this a gate, which the
            # header says at length it is not.
            if ! gh pr create --head lineup/auto --base main \
                 --title 'Free model lineup has moved' --body-file drift.md; then
              echo 'blocked=true' >> "$GITHUB_OUTPUT"
              echo '::warning::Could not open the pull request: Settings -> Actions ->'\
                'General -> Workflow permissions -> allow GitHub Actions to create and'\
                'approve pull requests. Branch lineup/auto holds the diff.'
            fi
          else
            gh pr edit lineup/auto --title 'Free model lineup has moved' \
              --body-file drift.md
          fi

      # Also the fallback when the diff could not be announced as one: a report that
      # reaches nobody is the failure this job has no other defence against.
      - name: Open or refresh the issue
        if: >-
          steps.check.outputs.changed == 'true'
          && (steps.sort.outputs.edited != 'true'
              || steps.pr.outputs.blocked == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED: ${{ steps.pr.outputs.blocked }}
        run: |
          set -euo pipefail
          title='Model lineup drift'
          # The body is the drift report, plus -- when this is standing in for a pull
          # request that could not be opened -- a line saying where the diff actually is,
          # so the thread is not a report of drift that looks like nothing was done.
          body=drift.md
          if [ "${BLOCKED:-}" = 'true' ]; then
            {
              echo 'The profile edit below was committed and pushed to `lineup/auto`, but'
              echo 'the pull request could not be opened: this repository has **Allow'
              echo 'GitHub Actions to create and approve pull requests** off, under'
              echo 'Settings -> Actions -> General -> Workflow permissions. Turn it on and'
              echo 'the next run opens the pull request, or open it by hand from the branch.'
              echo
              cat drift.md
            } > issue.md
            body=issue.md
          fi
          # Matched on the exact title, not through `--search`: that index is fuzzy and
          # eventually consistent, and a near-miss there opens a second issue every
          # morning until somebody notices thirty of them. The title reaches jq through
          # `env` rather than being interpolated into the filter, so it cannot break it.
          existing=$(TITLE="$title" gh issue list --state open --limit 100 \
            --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$body"
          else
            # Edited, not commented on. A month of quiet drift should be one thread
            # showing the current state, not thirty comments to read backwards.
            gh issue edit "$existing" --body-file "$body"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lineup
          path: |
            drift.md
            report/lineup.json
          if-no-files-found: warn
